apiVersion: v1
kind: Service
metadata:
  name: quarkus-svc
spec:
  selector:
    app: quarkus-backend
  ports:
    - protocol: TCP
      port: 8383
      targetPort: 8383
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarkus-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: quarkus-backend
  template:
    metadata:
      labels:
        app: quarkus-backend
    spec:
      containers:
        - name: quarkus
          image: quarkus-app
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8383
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: QUARKUS_DATASOURCE_JDBC_URL
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
